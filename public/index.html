    <!--
      Tema, React yüklenmeden önce uygulanır. Bu olmadan koyu modda
      sayfa bir an beyaz yanıp sönüyordu (flash of wrong theme).
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* localStorage kapalıysa açık temada kal */
        }
      })();
    </script>

    <!--
      GitHub Pages statik sunum yaptığı için /projects gibi adresler
      sunucuda yok ve 404 dönüyordu. 404.html o adresi ?redirect= olarak
      buraya yönlendiriyor, aşağıdaki satır da adres çubuğunu düzeltip
      react-router'ın devralmasını sağlıyor.
    -->
    <script>
      (function () {
        var redirect = new URLSearchParams(window.location.search).get('redirect');
        if (redirect) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
